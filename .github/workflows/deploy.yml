name: Continuous Deployment

# This workflow triggers on pushes to the 'release' branch
on:
  push:
    branches:
      - release

# Reminder to set necessary secrets in the GitHub repository settings for security.
# Secrets include credentials for Docker, SSH, and any sensitive application variables.

jobs:
  build:
    runs-on: ubuntu-latest  # Specifies that the job runs on the latest Ubuntu runner provided by GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v2  # Checks out the repository code to the runner

      - name: Login to Docker Hub
        uses: docker/login-action@v1  # Logs into Docker Hub using the secrets for Docker username and password
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1  # Sets up Docker Buildx for building and pushing images

      # Below steps build and push Docker images for different parts of the project, utilizing Docker caching mechanisms
      - name: Build and push maxitwit server
        uses: docker/build-push-action@v2
        with:
          context: .
          target: 'production'
          file: ./Dockerfile.app
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/maxitwitserver:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/maxitwitserver:serverbuildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/maxitwitserver:serverbuildcache,mode=max

      # Repeat similar steps for different components like API and test images
      - name: Build and push minitwit api
        # [similar content omitted for brevity]

      - name: Build and push fluentd image
        # [similar content omitted for brevity]

      - name: Run Snyk to check Docker image for vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test my-image || echo "Snyk found vulnerabilities in Docker image!"

      - name: Test maxitwit
        run: |
          docker build -t $DOCKER_USERNAME/maxitwittest -f Dockerfile.test .
          yes 2>/dev/null | docker compose -f tests_compose.yaml up --build -d
          chmod +x ./scripts/wait_for_compose.sh
          ./scripts/wait_for_compose.sh
          docker run --rm --network=maxitwit-test $DOCKER_USERNAME/maxitwittest
        env:
          TARGET: production
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}

      # Provision environment variables to remote worker nodes via SSH
      - name: Provision enviroment variables to worker1 node
        # [similar content omitted for brevity]

      - name: Provision enviroment variables to worker2 node
        # [similar content omitted for brevity]
      
      - name: Provision /remote_files to manager node
        run: >
          scp -r -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ./remote_files/ $SSH_USER@$SSH_HOST:/vagrant/remote_files
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Deploy to server
        run: >
          ssh $SSH_USER@$SSH_HOST
          -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no
          "export DOCKER_USERNAME=$DOCKER_USERNAME;
          export SESSION_SECRET=$SESSION_SECRET;
          export DATABASE_URL=$DATABASE_URL;
          /vagrant/remote_files/deploy.sh"
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
